name: iOS

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-14'
            args: '--verbose'
            mobile: 'ios'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable (ios)
        if: matrix.mobile == 'ios'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: install Rust stable (ios)
        if: matrix.mobile == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.mobile == 'ios'
        with:
          xcode-version: 16.2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> ./target

      - name: init mobile project
        if: matrix.mobile != ''
        run: |
          npx @tauri-apps/cli ${{ matrix.mobile }} init

      - name: install frontend dependencies
        run: yarn install

      - name: install icon
        run: yarn icon

      - name: Install provisioning profile
        env:
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          
          echo "$IOS_MOBILE_PROVISION" \
            | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/f18af002-3492-488c-875c-a70634fd1444.mobileprovision"
          
          echo "Installed provisioning profile:"
          ls -lh "$HOME/Library/MobileDevice/Provisioning Profiles/"
          
          security cms -D \
            -i "$HOME/Library/MobileDevice/Provisioning Profiles/f18af002-3492-488c-875c-a70634fd1444.mobileprovision" \
            > /tmp/profile.plist
          
          /usr/libexec/PlistBuddy \
            -c "Print :Name" /tmp/profile.plist
          
          /usr/libexec/PlistBuddy \
            -c "Print :UUID" /tmp/profile.plist

      - name: Check Xcode destinations
        run: |
          xcodebuild \
            -workspace src-tauri/gen/apple/ZenSSH.xcodeproj/project.xcworkspace \
            -scheme ZenSSH_iOS \
            -showdestinations

      - name: Tauri Project build
        if: matrix.mobile == 'ios'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_DEVELOPMENT_TEAM: BKTSDVCXRA
        run: yarn tauri ios build
