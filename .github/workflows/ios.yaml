name: iOS

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-14'
            args: '--verbose'
            mobile: 'ios'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable (ios)
        if: matrix.mobile == 'ios'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: install Rust stable (ios)
        if: matrix.mobile == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.mobile == 'ios'
        with:
          xcode-version: 16.2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> ./target

      - name: init mobile project
        if: matrix.mobile != ''
        run: |
          npx @tauri-apps/cli ${{ matrix.mobile }} init

      - name: install frontend dependencies
        run: yarn install

      - name: install icon
        run: yarn icon

      - name: Tauri Project build
        if: matrix.mobile == 'ios'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          set -e
          
          echo "Starting Tauri iOS build in background..."
          
          yarn tauri ios build --open --ci > /tmp/tauri-ios-build.log 2>&1 &
          TAURI_PID=$!
          
          echo "$TAURI_PID" > /tmp/tauri-ios-build.pid
          
          echo "Tauri PID: $TAURI_PID"
          
          # 等待 Xcode 工程生成
          echo "Waiting for Xcode project..."
          
          for i in {1..120}; do
            if [ -f "src-tauri/gen/apple/ZenSSH.xcodeproj/project.pbxproj" ]; then
              echo "Xcode project is ready."
              break
            fi
          
            if ! kill -0 "$TAURI_PID" 2>/dev/null; then
              echo "Tauri process exited unexpectedly."
              cat /tmp/tauri-ios-build.log
              exit 1
            fi
          
            sleep 1
          done
          
          if [ ! -f "src-tauri/gen/apple/ZenSSH.xcodeproj/project.pbxproj" ]; then
            echo "Timed out waiting for Xcode project."
            cat /tmp/tauri-ios-build.log
            exit 1
          fi
          
          echo "===== Tauri log ====="
          tail -100 /tmp/tauri-ios-build.log

      - name: Build unsigned iOS archive
        shell: bash
        run: |
          set -e
          
          xcodebuild archive \
            -project src-tauri/gen/apple/ZenSSH.xcodeproj \
            -scheme ZenSSH_iOS \
            -archivePath src-tauri/gen/apple/build/ZenSSH.xcarchive \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "${{ github.ref_name }}" \
            src-tauri/gen/apple/build/arm64/ZenSSH.ipa \
            --clobber
